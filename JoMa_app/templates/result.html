<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Analyseergebnis</title>
    <!-- Viewport-Meta-Tag für mobiles Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Eigene CSS-Datei (optional) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            background: #f9f9f9;
        }

        h1 {
            font-weight: 600;
            color: #333;
        }

        .analysis-card {
            background-color: #fff;
            border: none;
            border-radius: 8px;
            -webkit-box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        .btn-secondary, .btn-primary {
            border-radius: 25px;
        }

        .list-group-item {
            border: 0;
            border-bottom: 1px solid #ddd;
        }

        .badge.bg-primary {
            background-color: #0d6efd; /* Standard-Bootstrap-Blau, kann angepasst werden */
        }
    </style>
</head>
<body>
    <div class="container mt-4 mb-5">
        <h1 class="text-center mb-4">Analyseergebnis</h1>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card analysis-card">
                    <div class="text-center mb-4">
                        <a href="https://de.wikipedia.org/wiki/Hermersberg" target="_self">
                            <img
                                src="{{ url_for('static', filename='uploads/' ~ filename) }}"
                                alt="Hochgeladenes Bild"
                                class="img-fluid rounded"
                            >
                        </a>
                    </div>
                    <div class="mt-4 text-center">
                        <p>
                            <strong>Objekt ID:</strong> {{ result.predicted_class }}
                        </p>
                        <p>
                            <strong>Vertrauen:</strong> {{ result.confidence }}
                        </p>
                        <a
                            href="https://de.wikipedia.org/wiki/Hermersberg"
                            class="btn btn-secondary mb-3"
                        >
                            Link zum Shop
                        </a>
                    </div>
                    <h2 class="mt-4 mb-3 text-center">Top 5 Vorhersagen:</h2>
                    <ul class="list-group">
                        {% for item in top5 %}
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                {{ item.class }}
                                <span class="badge bg-primary rounded-pill">
                                    {{ item.probability }}
                                </span>
                            </li>
                        {% endfor %}
                    </ul>
                    <div class="mt-4 text-center">
                        <a href="{{ url_for('upload_file') }}" class="btn btn-secondary">
                            Ein weiteres Bild hochladen
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS (optional, für interaktive Komponenten) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
